name: Deploy unbscholar.lib.unb.ca

on:
  push:
    branches: [prod, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: unb-libraries/github-workflows/.github/workflows/build-push-deploy-notify.yaml@1.x
    with:
      branch-env-map: '{"prod":"prod"}'
      deploy-branches: '["prod"]'
      image-name: 'ghcr.io/unb-libraries/unbscholar.lib.unb.ca'
      k8s-deployment-name: 'unbscholar-lib-unb-ca'
      build-themes: false
      platforms: 'linux/amd64'
      check-logs: true
      log-check-profile: 'generic'
      # Ported from DSpaceFrontendDeploymentCommands::provideErrorLogConfiguration, whose
      # pattern and description were swapped (so 6.x never applied it).
      log-check-exceptions: |
        rules skipped due to selector errors
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
