<nav [ngClass]="{'open': (menuCollapsed | async) !== true}"
     [@slideMobileNav]="(isMobile$ | async) !== true ? 'default' : ((menuCollapsed | async) ? 'collapsed' : 'expanded')"
     class="navbar navbar-light navbar-expand-md px-md-0 navbar-container" role="navigation"
     [attr.aria-label]="'nav.main.description' | translate" id="main-navbar">
  <!-- TODO remove navbar-container class when https://github.com/twbs/bootstrap/issues/24726 is fixed -->
  <div class="navbar-inner-container" [class.container]="(isMobile$ | async) !== true">
    <div class="w-100">
      <div id="collapsingNav">
        @if ((isMobile$ | async) && (isAuthenticated$ | async)) {
        <ds-user-menu [inExpandableNavbar]="true"></ds-user-menu>
        }
        <div class="navbar-nav align-items-md-center me-auto shadow-none gapx-3" role="menubar">
          @for (section of (sections | async); track section) {
          <ng-container
              *ngComponentOutlet="(sectionMap$ | async).get(section.id)?.component; injector: (sectionMap$ | async).get(section.id)?.injector;"></ng-container>
          }
          <div ngbDropdown class="d-inline-block dropdown" #aboutDropdown="ngbDropdown"
                 (mouseenter)="aboutDropdown.open()" (mouseleave)="aboutDropdown.close()">
            <a href="javascript:void(0);" class="border-0 ds-menu-item px-0 py-2" id="dropdownAbout" role="button" ngbDropdownToggle>
              About
            </a>
            <div ngbDropdownMenu id="dropdownMenuSlide" aria-labelledby="dropdownAbout" role="menu">
              <a href="https://lib.unb.ca/unb-scholar" class="ds-menu-item" ngbDropdownItem>What is UNB Scholar?</a>
              <a href="https://lib.unb.ca/unb-scholar/deposit" class="ds-menu-item" ngbDropdownItem>Deposit to UNB Scholar</a>
              <a href="https://lib.unb.ca/unb-scholar/policy" class="ds-menu-item" ngbDropdownItem>UNB Scholar Policy</a>
              <a href="https://lib.unb.ca/unb-scholar/contact" class="ds-menu-item" ngbDropdownItem>Contact</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>
