services:
  unbscholar-lib-unb-ca:
    build:
      args:
        BUILD_CMD: ''
        NODE_ENV: development
      context: .
      target: builder
    restart: unless-stopped
    container_name: unbscholar.lib.unb.ca
    env_file:
      - env/common.env
      - env/angular.env
    volumes:
      - ./build/src:/build/src
    expose:
      - "4000"
    networks:
      - unbscholar.lib.unb.ca
    ports:
      - "9988:4000"
  unbscholar-dspace-lib-unb-ca:
    build:
      context: local/dspace/
    restart: unless-stopped
    env_file:
      - env/common.env
      - env/dspace.env
    expose:
      - "8080"
    ports:
      - "9989:8080"
    networks:
      - unbscholar.lib.unb.ca
    depends_on:
      unbscholar-postgres-lib-unb-ca:
        condition: service_healthy
  unbscholar-postgres-lib-unb-ca:
    image: ghcr.io/unb-libraries/postgres:17.9
    restart: unless-stopped
    env_file:
      - ./env/common.env
      - ./env/postgres.env
    expose:
      - "5432"
    networks:
      - unbscholar.lib.unb.ca
    volumes:
      - ./local/postgres/build/scripts/install-pgcrypto.sh:/docker-entrypoint-initdb.d/install-pgcrypto.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  unbscholar-solr-lib-unb-ca:
    image: ghcr.io/unb-libraries/solr:9.10
    restart: unless-stopped
    env_file:
      - env/common.env
    environment:
      SOLR_MODULES: extraction,langid,ltr,analysis-extras
      SOLR_OPTS: "-Dsolr.lock.type=none -Dsolr.autoSoftCommit.maxTime=3000"
      SOLR_JAVA_MEM: "-Xms1g -Xmx1g"
    expose:
      - "8983"
    networks:
      - unbscholar.lib.unb.ca
    volumes:
      - ./local/solr/build/data/cores:/cores-template:ro
    command:
      - bash
      - -c
      - |
        set -e
        for CORE in authority oai qaevent search statistics suggestion; do
          if [ -d "/cores-template/$$CORE" ] && [ ! -f "/var/solr/data/$$CORE/core.properties" ]; then
            echo "Configuring core $$CORE..."
            cp -r "/cores-template/$$CORE" "/var/solr/data/$$CORE"
            echo "name=$$CORE" > "/var/solr/data/$$CORE/core.properties"
          fi
        done
        exec /opt/solr/docker/scripts/docker-entrypoint.sh solr-foreground

networks:
  unbscholar.lib.unb.ca:
    name: unbscholar.lib.unb.ca
