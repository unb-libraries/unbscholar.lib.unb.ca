db.driver = org.postgresql.Driver
db.password = dspace
db.schema = public
db.url = jdbc:postgresql://unbscholar-postgres-lib-unb-ca:5432/dspace
db.username = dspace
default.language = en_US
dspace.dir = /dspace
dspace.name = UNB Scholar
dspace.server.url = http://localhost:9989/server
dspace.ui.url = http://localhost:9988

# Internal SSR-side REST URL used by the Angular Node server. Must match
# rest.ssrBaseUrl in angular conf. See DSpace/DSpace#9856.
dspace.server.ssr.url = http://unbscholar-dspace-lib-unb-ca:8080/server

solr.server = http://unbscholar-solr-lib-unb-ca:8983/solr
webui.browse.index.1 = dateissued:item:dateissued
webui.browse.index.2 = title:item:title
webui.browse.index.3 = author:metadata:dc.contributor.*\,dc.creator:text
webui.browse.index.4 = subject:metadata:dc.subject.discipline:text
webui.browse.vocabularies.disabled = srsc

usage-statistics.dbfile = /dbip/dbip-city-lite.mmdb

# Disable ORCID integration (requires API credentials)
orcid.synchronization-enabled = false
